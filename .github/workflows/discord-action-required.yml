name: Discord action required

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  pull_request:
    types:
      - review_requested
  issues:
    types:
      - assigned

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ACTION_REQUIRED }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)
              workflow_name=$(jq -r '.workflow_run.name' <<< "$EVENT_JSON")
              conclusion=$(jq -r '.workflow_run.conclusion' <<< "$EVENT_JSON")
              details_url=$(jq -r '.workflow_run.html_url' <<< "$EVENT_JSON")
              content="🚨 Workflow ${workflow_name} zakończył się statusem ${conclusion} w ${REPOSITORY}. ${details_url}"
              ;;
            pull_request)
              number=$(jq -r '.pull_request.number' <<< "$EVENT_JSON")
              title=$(jq -r '.pull_request.title' <<< "$EVENT_JSON")
              details_url=$(jq -r '.pull_request.html_url' <<< "$EVENT_JSON")
              requester=$(jq -r '.sender.login' <<< "$EVENT_JSON")
              target=$(jq -r '.requested_reviewer.login // .requested_team.name // "zespół"' <<< "$EVENT_JSON")
              content="👀 ${requester} prosi ${target} o review PR #${number}: ${title}. ${details_url}"
              ;;
            issues)
              number=$(jq -r '.issue.number' <<< "$EVENT_JSON")
              title=$(jq -r '.issue.title' <<< "$EVENT_JSON")
              details_url=$(jq -r '.issue.html_url' <<< "$EVENT_JSON")
              assignee=$(jq -r '.assignee.login' <<< "$EVENT_JSON")
              content="📌 ${assignee} otrzymał Issue #${number}: ${title}. ${details_url}"
              ;;
            *)
              exit 0
              ;;
          esac

          payload=$(jq -n --arg content "$content" '{content: $content}')
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
